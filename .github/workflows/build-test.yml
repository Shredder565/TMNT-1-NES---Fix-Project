name: Build and test NES source
on:
  push:
  pull_request:
jobs:
  source-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact original rebuild
        run: python tools/build.py --expect-vanilla
      - name: Run recovery/modification tests
        run: python -m unittest discover -s tests -v
